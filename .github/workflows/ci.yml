# CI: typecheck, LLM boundary, tests, build, dependency audit. Holds NO real secrets and makes no network call to any
# LLM or to Supabase: every value below is a placeholder. Deployment is Vercel's job (push to main), not this workflow's.
name: ci
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      SUPABASE_SERVICE_ROLE_KEY: placeholder
      NEXT_PUBLIC_ROOT_DOMAIN: liveportfolio.site
      NEXT_PUBLIC_APP_URL: https://liveportfolio.site
      OPENAI_API_KEY: placeholder
      RESEND_API_KEY: placeholder
      PAYSTACK_SECRET_KEY: placeholder
      CRON_SECRET: placeholder
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:llm
      - run: npm test
      - run: npm run build
      - name: dependency audit (advisory until the existing findings are triaged)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
